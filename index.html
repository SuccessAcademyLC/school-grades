  /* Таблица — горизонтальный скролл */
  .tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:8px}
  /* Sticky колонки # и Студент */
  .tw table td:nth-child(1),.tw table th:nth-child(1){position:sticky;left:0;z-index:2;background:var(--color-background-primary)}
  .tw table td:nth-child(2),.tw table th:nth-child(2){position:sticky;left:30px;z-index:2;background:var(--color-background-primary);box-shadow:2px 0 4px rgba(0,0,0,.07)}
  body.dark .tw table td:nth-child(1),body.dark .tw table th:nth-child(1),
  body.dark .tw table td:nth-child(2),body.dark .tw table th:nth-child(2){background:#161927}
  /* Ячейки ввода */
  .gi{width:34px;font-size:11px;padding:2px}
  .ob{font-size:11px;padding:2px 6px}
  /* Модальные окна — снизу */
  #mbg{align-items:flex-end}
  #mbox{width:100%!important;max-width:100%!important;max-height:88vh;overflow-y:auto;border-radius:20px 20px 0 0;margin:0!important}
  /* Hamburger */
  .menu-btn{display:flex!important}
  /* Teacher bar */
  .tch-bar{flex-wrap:wrap;padding:5px 10px;font-size:11px;gap:5px}
  /* Duty calendar */
  .duty-cal{grid-template-columns:repeat(4,1fr)!important;gap:4px!important}
  /* Filters */
  .fs{max-width:100%}
}

<script>
const SESSION_KEY='sa_session';
const SESSION_DAYS=1; // remember for 24 hours

function saveSession(user){
  const exp=Date.now()+(SESSION_DAYS*24*60*60*1000);
  localStorage.setItem(SESSION_KEY,JSON.stringify({user,exp}));
}
function loadSession(){
  try{
    const raw=localStorage.getItem(SESSION_KEY);
    if(!raw) return null;
    const {user,exp}=JSON.parse(raw);
    if(Date.now()>exp){localStorage.removeItem(SESSION_KEY);return null;}
    return user;
  }catch(e){return null;}
}
function clearSession(){localStorage.removeItem(SESSION_KEY);}



function setLang(l){
  curLang=l;
  localStorage.setItem('sa_lang',l);
  document.documentElement.lang=l;
  updateLangBtn(l);
  applyI18n();
  if(curUser) renderAll();
  else{
    const ltEl=document.getElementById('login-title-text');
    if(ltEl) ltEl.textContent=tr('loginTitle');
    const ll=document.getElementById('ll-login');
    const lp=document.getElementById('ll-pass');
    const lb=document.getElementById('li-btn');
    if(ll) ll.textContent=tr('loginLbl');
    if(lp) lp.textContent=tr('passLbl');
    if(lb) lb.textContent=tr('loginBtn');
  }
}
function applyI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    if(el.children.length>0) return;
    const key=el.getAttribute('data-i18n');
    const txt=tr(key);
    if(txt&&txt!==key) el.textContent=txt;
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{
    const key=el.getAttribute('data-i18n-placeholder');
    const txt=tr(key);
    if(txt&&txt!==key) el.placeholder=txt;
  });
}

function toggleLangMenu(){
  const m=document.getElementById('lang-menu');
  if(m) m.style.display=m.style.display==='none'?'block':'none';
}
document.addEventListener('click',e=>{
  const wrap=document.getElementById('lang-wrap');
  if(wrap&&!wrap.contains(e.target)){
    const m=document.getElementById('lang-menu');
    if(m) m.style.display='none';
  }
});
function updateLangBtn(l){
  const flagImgs={
    ru:'https://flagcdn.com/24x18/ru.png',
    en:'https://flagcdn.com/24x18/gb.png'
  };
  const labels={ru:'RU',en:'EN'};
  const flag=document.getElementById('lang-cur-flag');
  const txt=document.getElementById('lang-cur-text');
  if(flag){
    flag.innerHTML=`<img src="${flagImgs[l]||''}" style="width:22px;height:16px;border-radius:2px;object-fit:cover;vertical-align:middle" onerror="this.style.display='none'">`;
  }
  if(txt) txt.textContent=' '+( labels[l]||l.toUpperCase());
}
function toggleTheme(){
  const isDark=document.body.classList.toggle('dark');
  localStorage.setItem('sa_theme',isDark?'dark':'light');
  document.getElementById('theme-btn').textContent=isDark?'☀️':'🌙';
}

function applyTheme(){
  document.documentElement.lang=curLang;
  const saved=localStorage.getItem('sa_theme');
  if(saved==='dark'){document.body.classList.add('dark');const tb=document.getElementById('theme-btn');if(tb)tb.textContent='☀️';}
  updateLangBtn(curLang);
}

async function loadData(){
  let local={};
  try{local=JSON.parse(localStorage.getItem(LOCAL_KEY)||'{}');}catch(e){}
  if(!FIREBASE_URL){
    if(local.teachers) D=local;
  } else {
    try{
      const r=await fetch(`${FIREBASE_URL}/data.json?t=${Date.now()}`);
      if(r.ok){
        const cloud=await r.json()||{};
        const cloudTime=new Date(cloud._savedAt||0).getTime();
        const lcTime=new Date(local._localAt||local._savedAt||0).getTime();
        const lcScore=(local.teachers||[]).length*10+(local.accounts||[]).length;
        const cloudScore=(cloud.teachers||[]).length*10+(cloud.accounts||[]).length;
        // Always prefer cloud if it has data and is newer or equal
        // Only use local if it's significantly newer (unsaved local changes)
        const localIsNewer=lcTime>cloudTime+5000; // 5 sec buffer
        if(cloudScore>0&&!localIsNewer){
          // Cloud is authoritative
          D=cloud;
          // Sync local to match cloud
          try{localStorage.setItem(LOCAL_KEY,JSON.stringify(cloud));}catch(e){}
        } else if(lcScore>0&&localIsNewer){
          // Local has unsaved changes newer than cloud
          D=local;setTimeout(saveData,1000);
        } else if(cloudScore>0){
          D=cloud;
        } else if(lcScore>0){
          D=local;setTimeout(saveData,1000);
        }
      } else if(local.teachers){D=local;}
    }catch(e){
      if(local.teachers){D=local;toast('Нет соединения. Работаем локально.','error');}
    }
  }
  fixFirebaseArrays(D);
  if(!D.settings) D.settings={pin:DPIN};
  if(!D.teachers) D.teachers=[];
  if(!D.students) D.students=[];
  if(!D.accounts) D.accounts=[];
  if(!D.archives) D.archives=[];
  if(!D.duties) D.duties={};
  const today=new Date().toISOString().slice(0,10);
  let expiredClosed=false;
  (D.accounts||[]).filter(a=>a.role==='supporter').forEach(a=>{
    (a.replacements||[]).forEach(r=>{if(r.active&&r.dateTo&&r.dateTo<today){r.active=false;expiredClosed=true;}});
  });
  if(expiredClosed) setTimeout(saveData,500);
  dataLoaded=true;
}

function fixFirebaseArrays(obj){
  if(!obj||typeof obj!=='object') return;
  const toArr=v=>(v&&!Array.isArray(v)&&typeof v==='object')?Object.values(v):(Array.isArray(v)?v:v!=null?[v]:[]);
  const padArr=(arr,len)=>{if(!arr) return Array(len).fill(null);while(arr.length<len) arr.push(null);return arr;};
  ['teachers','students','accounts','archives'].forEach(k=>{
    if(obj[k]) obj[k]=toArr(obj[k]);
  });
  if(Array.isArray(obj.teachers)) obj.teachers.forEach(t=>{
    if(t.groups) t.groups=toArr(t.groups);
    if(Array.isArray(t.groups)) t.groups.forEach(g=>{
      if(g.students) g.students=toArr(g.students);
      if(Array.isArray(g.students)) g.students.forEach(s=>{
        if(!s) return;
        s.units=padArr(toArr(s.units),12);
        s.homework=padArr(toArr(s.homework),5);
        s.achievements=padArr(toArr(s.achievements),5);
        // Russian
        if(s.conversations) s.conversations=padArr(toArr(s.conversations),10);
        if(s.vocabulary) s.vocabulary=padArr(toArr(s.vocabulary),10);
        if(s.presentations) s.presentations=padArr(toArr(s.presentations),2);
        if(s.units_grammar) s.units_grammar=padArr(toArr(s.units_grammar),12);
        if(s.units_vocab) s.units_vocab=padArr(toArr(s.units_vocab),12);
      });
    });
  });
  if(Array.isArray(obj.accounts)) obj.accounts.forEach(a=>{
    ['replacements','mockTests','reports'].forEach(k=>{
      if(a[k]) a[k]=toArr(a[k]);
    });
  });
}

function createArchive(){

  const snap=JSON.parse(JSON.stringify(D.teachers));
  const date=new Date().toLocaleDateString('ru');
  if(!D.archives) D.archives=[];
  const newArch={id:uid(),label,date,teachers:snap};
  D.archives.push(newArch);
  closeModal();sched();toast('Архив создан ✓','success');
  // Immediately open the new archive
  gotoArch(newArch.id);
}

function renderHome(el){
  const teachers=isAdmin()?D.teachers:D.teachers.filter(t=>t.id===curUser?.teacherId);
  // Sort by average student score descending
  const sortedTeachers=[...teachers].sort((a,b)=>{
    const avg=t=>{let s=0,c=0;(t.groups||[]).forEach(g=>(g.students||[]).forEach(st=>{const o=calcFinal(st,g.level);if(o!==null){s+=o;c++;}}));return c?s/c:-1;};
    return avg(b)-avg(a);
  });
  const tt=teachers.length;
  const tg=teachers.reduce((s,t)=>s+(t.groups||[]).length,0);
  const ts=teachers.reduce((s,t)=>s+(t.groups||[]).reduce((a,g)=>a+(g.students||[]).filter(s=>s.name).length,0),0);
  let sum=0,cnt=0;
  teachers.forEach(t=>(t.groups||[]).forEach(g=>(g.students||[]).forEach(s=>{const o=calcFinal(s,g.level);if(o!==null){sum+=o;cnt++;}})));
  // Collect hidden students for admin notification
  const hiddenAlert=[];
  if(isAdmin()){
    teachers.forEach(tc=>(tc.groups||[]).forEach(g=>(g.students||[]).forEach(s=>{
      if(s.hidden) hiddenAlert.push({s,g,tc});
    })));
  }
  // Collect new supporter reports

function renderRusRow(s,num,g,ed){
  const cfg=RUS_CFG[g.level]||RUS_CFG['rus-1'];
  const sid=s?s.id:'';
  const empty=!s||!s.name;
  const ov=s?calc(s,g.level):null;
  const ovc=ov===null?'on':ov>=75?'og':ov>=70?'oy':'or';
  const gcell=(val,field,idx)=>{
    const v=(val!=null&&val!=='')?val:'';
    const isZero=v!==''&&parseFloat(v)===0;
    if(ed) return `<input class="gi${isZero?' zero':''}" type="text" inputmode="decimal" value="${v}" oninput="gchRus('${sid}','${field}',${idx!=null?idx:'null'},this.value)" onkeydown="gradeKey(event,this)" onfocus="this.select()" placeholder="">`;
    return `<span style="color:${v===''?'#ddd':isZero?'#b45309':'inherit'};${isZero?'font-weight:700;background:#fff8f0;padding:1px 5px;border-radius:4px;':''}">` + (v!==''?fmt(v):'—') + `</span>`;
  };
  const namecell=ed
    ?`<input class="ni" type="text" value="${s?s.name:''}" placeholder="Введите имя..." onblur="nameBlur('${sid}',${num-1},this)" onkeydown="nameKey(event,'${sid}',${num-1},this)" onfocus="this.select()">`
    :(s?.name?`<span class="name-link" onclick="clickStudent('${sid}')">${s.name}</span>`:'<span style="color:#ddd">—</span>');
  // Always use exact size arrays to prevent misalignment
  const convs=Array(cfg.conv).fill(null).map((_,i)=>(s?.conversations||[])[i]??null);
  const hws=Array(cfg.hw).fill(null).map((_,i)=>(s?.homework||[])[i]??null);
  const vocabs=Array(cfg.vocab).fill(null).map((_,i)=>(s?.vocabulary||[])[i]??null);
  const ppts=Array(cfg.ppt).fill(null).map((_,i)=>(s?.presentations||[])[i]??null);
  return `<tr class="${empty?'empty-row':''}">
    <td class="nc">${num}</td>
    <td class="nmc">${namecell}</td>
    ${convs.map((v,i)=>`<td${i===0?' class="gb"':''}>${gcell(v,'conversations',i)}</td>`).join('')}
    ${hws.map((v,i)=>`<td${i===0?' class="gb"':''}>${gcell(v,'homework',i)}</td>`).join('')}
    ${vocabs.map((v,i)=>`<td${i===0?' class="gb"':''}>${gcell(v,'vocabulary',i)}</td>`).join('')}
    ${ppts.map((v,i)=>`<td${i===0?' class="gb"':''}>${gcell(v,'presentations',i)}</td>`).join('')}
    <td class="gb">${gcell(s?.finalConversation,'finalConversation')}</td>
    ${cfg.hasFinalTest?`<td>${gcell(s?.finalTest,'finalTest')}</td>`:''}
    <td><span class="ob ${ovc}" data-ov="${sid}">${ov!==null?ov.toFixed(1):'—'}</span></td>
    ${ed&&!empty?`<td><div class="row-acts">
      <button class="ra ra-move" onclick="showMoveStudent('${sid}')" title="Перенести">↗</button>
      <button class="ra ra-arch" onclick="archiveStudent('${sid}')" title="В архив">📦</button>
      <button class="ra ra-del" onclick="delStudent('${sid}')" title="Удалить">×</button>
    </div></td>`:(ed?'<td></td>':'')}
  </tr>`;
}

function gchRus(sid,field,idx,val){
  if(!sid) return;
  const t=D.teachers.find(x=>x.id===selT);
  const g=(t?.groups||[]).find(x=>x.id===selG);
  const s=(g?.students||[]).find(x=>x.id===sid);
  if(!s) return;
  const inp=event?.target||null;
  if(!validateGradeInput(inp,val,100)) return;
  const n=val===''?null:parseFloat(val);
  if(idx!==null){
    if(!s[field])s[field]=[];
    s[field][idx]=n;
    // Auto-fill gaps with 0
    if(n!==null){
      const arr=s[field];
      const lastFilled=arr.reduce((last,v,i)=>v!==null?i:last,-1);
      let autoFilled=0;
      for(let i=0;i<lastFilled;i++){if(arr[i]===null||arr[i]===undefined){arr[i]=0;autoFilled++;}}
      if(autoFilled>0) toast(`${autoFilled} пропущенных ячеек заполнено нулём`,'');
    }
  } else s[field]=n;
  const ov=calc(s,g.level);
  const badge=document.querySelector(`[data-ov="${sid}"]`);
  if(badge){badge.textContent=ov!==null?ov.toFixed(1):'—';badge.className='ob '+(ov===null?'on':ov>=75?'og':ov>=70?'oy':'or');}
  sched();
}

function srow(s,num,g,ed,archMode){

  const finalOv=ov!==null?(ov+(retake||0)):(retake!==null?retake:null);
  const ovc=finalOv===null?'on':finalOv>=75?'og':finalOv>=70?'oy':'or';
  const gcell=(val,field,idx)=>{
    const v=(val!=null&&val!=='')?val:'';
    const isZero=v!==''&&parseFloat(v)===0;

    return `<span style="color:${v===''?'#ddd':isZero?'#b45309':'inherit'};${isZero?'font-weight:700;background:#fff8f0;padding:1px 5px;border-radius:4px;':''}">` + (v!==''?fmt(v):'—') + `</span>`;
  };
  const namecell=ed
    ?`<input class="ni" type="text" value="${s?s.name:''}" placeholder="Введите имя..." onblur="nameBlur('${sid}',${num-1},this)" onkeydown="nameKey(event,'${sid}',${num-1},this)" onfocus="this.select()">`
    :(s?.name?`<span class="name-link" onclick="clickStudent('${sid}')">${s.name}</span>`:'<span style="color:#ddd">—</span>');
  const us=s?(Array.isArray(s.units)?s.units:Array(12).fill(null)).concat(Array(12).fill(null)).slice(0,12):Array(12).fill(null);
  const hw=s?(Array.isArray(s.homework)?s.homework:Array(5).fill(null)).concat(Array(5).fill(null)).slice(0,5):Array(5).fill(null);
  const at=s?(Array.isArray(s.achievements)?s.achievements:Array(5).fill(null)).concat(Array(5).fill(null)).slice(0,5):Array(5).fill(null);
  return `<tr class="${empty?'empty-row':''}">
    <td class="nc">${num}</td>
    <td class="nmc">${namecell}</td>
    ${us.map((v,i)=>{
      if(isDoubleUnit){
        const gr=s?.units_grammar?.[i]??null;
        const vc=s?.units_vocab?.[i]??null;
        const score=v!=null&&v!==''?v:'';
        const color=score===''?'#ddd':Number(score)>=75?'#1b5e20':Number(score)>=70?'#e65100':'#b71c1c';

      }
      return `<td${i===0?' class="gb"':''}>${gcell(v,'units',i)}</td>`;
    }).join('')}
    ${hw.map((v,i)=>`<td${i===0?' class="gb"':''}>${gcell(v,'homework',i)}</td>`).join('')}
    ${at.map((v,i)=>`<td${i===0?' class="gb"':''}>${gcell(v,'achievements',i)}</td>`).join('')}

    <td>${gcell(s?.speaking,'speaking')}</td>

// ── Calc ──────────────────────────────────────────────────────────────────
function calc(s,level){
  if(!s||!s.name) return null;
  const ok=v=>v!==null&&v!==undefined&&v!=='';
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;

  // Russian language formula
  if(RUS_LEVELS.includes(level)){
    const conv=(s.conversations||[]).filter(ok).map(Number).filter(v=>!isNaN(v));
    const hw=(s.homework||[]).filter(ok).map(Number).filter(v=>!isNaN(v));
    const vocab=(s.vocabulary||[]).filter(ok).map(Number).filter(v=>!isNaN(v));
    const ppts=(s.presentations||[]).filter(ok).map(Number).filter(v=>!isNaN(v));
    const finConv=ok(s.finalConversation)?Number(s.finalConversation):null;
    const finTest=ok(s.finalTest)?Number(s.finalTest):null;
    if(!conv.length&&!hw.length&&!vocab.length&&!ppts.length&&finConv===null) return null;
    const pptAvg=ppts.length?avg(ppts):0;
    if(level==='rus-1'){
      // Conv 15% + HW 10% + Vocab 15% + PPT 20% + FinalConv 25% + FinalTest 15%
      return avg(conv)*.15+avg(hw)*.10+avg(vocab)*.15+pptAvg*.20+(finConv||0)*.25+(finTest||0)*.15;
    } else {
      // Conv 15% + HW 12% + Vocab 13% + PPT 20% + FinalConv 40%
      return avg(conv)*.15+avg(hw)*.12+avg(vocab)*.13+pptAvg*.20+(finConv||0)*.40;
    }
  }

  // English formula
  const u=(s.units||[]).filter(ok).map(Number).filter(v=>!isNaN(v));
  const hw=(s.homework||[]).filter(ok).map(Number).filter(v=>!isNaN(v));
  const at=(s.achievements||[]).filter(ok).map(Number).filter(v=>!isNaN(v));
  const ppt=ok(s.presentation)?Number(s.presentation):null;
  const spt=ok(s.speaking)?Number(s.speaking):null;
  const fin=ok(s.final)?Number(s.final):null;
  if(!u.length&&!hw.length&&!at.length&&ppt===null&&spt===null&&fin===null) return null;
  const isE=['beginner','elementary'].includes(level);
  return avg(u)*.10+avg(hw)*.10+avg(at)*.15+(ppt||0)*.20+(isE?(spt||0)*.15+(fin||0)*.30:(spt||0)*.25+(fin||0)*.20);
}
function calcFinal(s,level){
  const ov=calc(s,level);
  const r=s?.retake!=null&&s?.retake!==''?Number(s.retake):null;
  return ov!==null?(ov+(r||0)):(r!==null?r:null);
}

// ── Grade input ───────────────────────────────────────────────────────────
function validateGradeInput(inp,val,max){
  if(val===''||val===null){inp&&inp.classList.remove('err');inp&&inp.classList.remove('zero');return true;}
  const n=parseFloat(val);
  const ok=!isNaN(n)&&n>=0&&n<=(max||100);
  if(inp){
    inp.classList.toggle('err',!ok);
    inp.classList.toggle('zero',ok&&n===0);
    if(!ok) setTimeout(()=>inp.classList.remove('err'),1500);
  }
  return ok;
}

function gch(sid,field,idx,val){
  if(!sid) return;
  const t=D.teachers.find(x=>x.id===selT);
  const g=(t?.groups||[]).find(x=>x.id===selG);
  const s=(g?.students||[]).find(x=>x.id===sid);
  if(!s) return;
  // Find the input element for validation
  const inp=event?.target||null;
  const max=field==='retake'?6:100;
  if(!validateGradeInput(inp,val,max)) return;
  const n=val===''?null:parseFloat(val);
  if(idx!==null){
    if(!s[field])s[field]=Array(field==='units'?12:5).fill(null);
    s[field][idx]=n;
    // Auto-fill gaps with 0: if there's a value after a gap, fill gaps with 0
    if(n!==null){
      const arr=s[field];
      const lastFilled=arr.reduce((last,v,i)=>v!==null?i:last,-1);
      let autoFilled=0;
      for(let i=0;i<lastFilled;i++){if(arr[i]===null){arr[i]=0;autoFilled++;}}
      if(autoFilled>0) toast(`${autoFilled} пропущенных ${field==='units'?'юнит':'ячеек'} заполнено нулём автоматически`,'');
    }
  } else s[field]=n;
  const ov=calc(s,g.level);
  const r=s.retake!=null&&s.retake!==''?Number(s.retake):null;
  const fv=ov!==null?(ov+(r||0)):(r!==null?r:null);
  const badge=document.querySelector(`[data-ov="${sid}"]`);
  if(badge){badge.textContent=fv!==null?fv.toFixed(1):'—';badge.className='ob '+(fv===null?'on':fv>=75?'og':fv>=70?'oy':'or');}
  sched();
}

function updateUnitPreview(){
  const gr=parseFloat(document.getElementById('ut-gr')?.value||0);
  const vc=parseFloat(document.getElementById('ut-vc')?.value||0);
  const score=(gr/50*70)+(vc/50*30);
  const el=document.getElementById('ut-score');
  if(el){
    el.textContent=isNaN(score)?'—':score.toFixed(1);
    el.style.color=score>=75?'#1b5e20':score>=70?'#e65100':'#b71c1c';
  }
}

function saveUnitScore(sid,idx){
  const t=D.teachers.find(x=>x.id===selT);
  const g=(t?.groups||[]).find(x=>x.id===selG);
  const s=(g?.students||[]).find(x=>x.id===sid);
  if(!s) return;
  const gr=parseFloat(document.getElementById('ut-gr')?.value);
  const vc=parseFloat(document.getElementById('ut-vc')?.value);
  if(isNaN(gr)&&isNaN(vc)){closeModal();return;}
  if(!s.units) s.units=Array(12).fill(null);
  if(!s.units_grammar) s.units_grammar=Array(12).fill(null);
  if(!s.units_vocab) s.units_vocab=Array(12).fill(null);
  const grVal=isNaN(gr)?null:Math.min(50,Math.max(0,gr));
  const vcVal=isNaN(vc)?null:Math.min(50,Math.max(0,vc));
  s.units_grammar[idx]=grVal;
  s.units_vocab[idx]=vcVal;
  // Calculate combined score
  const score=((grVal||0)/50*70)+((vcVal||0)/50*30);
  s.units[idx]=parseFloat(score.toFixed(2));
  closeModal();
  renderGroup(document.getElementById('main'));
  sched();
  // Save to Firebase immediately
  saveData();
  scheduleSheets();
}

function clearUnitScore(sid,idx){
  const t=D.teachers.find(x=>x.id===selT);
  const g=(t?.groups||[]).find(x=>x.id===selG);
  const s=(g?.students||[]).find(x=>x.id===sid);
  if(!s) return;
  if(s.units) s.units[idx]=null;
  if(s.units_grammar) s.units_grammar[idx]=null;
  if(s.units_vocab) s.units_vocab[idx]=null;
  closeModal();
  renderGroup(document.getElementById('main'));
  sched();
}

// Google Sheets sync
let _sheetsTimer=null;
function scheduleSheets(){
  clearTimeout(_sheetsTimer);
  _sheetsTimer=setTimeout(syncToSheets, SHEETS_DELAY);
  // Show indicator
  const pill=document.getElementById('sheets-pill');
  if(pill){pill.style.display='flex';pill.textContent='📊 Отправка через 10 мин...';}
}

async function syncToSheets(){
  const rows=[];
  D.teachers.forEach(tc=>(tc.groups||[]).forEach(g=>{
    // Skip russian language groups entirely
    if(RUS_LEVELS.includes(g.level)) return;
    const tName=tc.name;
    const gName=`${lvl(g.level)} ${g.day} ${g.time}`;
    // Unit Tests (beginner/elementary only)
    if(['beginner','elementary'].includes(g.level)){
      (g.students||[]).filter(s=>s&&s.name).forEach(s=>{
        (s.units||[]).forEach((v,i)=>{
          const score=Number(v);
          if(v!=null&&v!==''&&score>0&&score<=59.999){
            rows.push({
              student:s.name, group:gName, teacher:tName,
              test:`Unit Test ${i+1}`,
              grammar:s.units_grammar?.[i]??'',
              vocabulary:s.units_vocab?.[i]??'',
              score:score.toFixed(1)
            });
          }
        });
      });
    }
    // Achievement Tests (english groups only)
    (g.students||[]).filter(s=>s&&s.name).forEach(s=>{
      (s.achievements||[]).forEach((v,i)=>{
        const score=Number(v);
        if(v!=null&&v!==''&&score>0&&score<=59.999){
          rows.push({
            student:s.name, group:gName, teacher:tName,
            test:`Achievement Test ${i+1}`,
            grammar:'', vocabulary:'',
            score:score.toFixed(1)
          });
        }
      });
    });
  }));
  if(!rows.length){
    const pill=document.getElementById('sheets-pill');
    if(pill) pill.style.display='none';
    return;
  }
  try{
    // Silent fetch - data confirmed working
    for(const row of rows){
      const params=new URLSearchParams({data:JSON.stringify(row)});
      const url=SHEETS_WEBHOOK+'?'+params.toString();
      fetch(url,{mode:'no-cors'}).catch(()=>{});
      await new Promise(r=>setTimeout(r,300));
    }
    const pill=document.getElementById('sheets-pill');
    if(pill){pill.textContent='📊 Отправлено ✓';setTimeout(()=>{pill.style.display='none';},3000);}
    toast(`📊 ${rows.length} записей отправлено в Google Sheets`,'success');
  }catch(e){
    toast('Ошибка отправки в Google Sheets','error');
  }
}

function nameBlur(sid,rowIdx,inp){
  const val=inp.value.trim();
  const t=D.teachers.find(x=>x.id===selT);
  const g=(t?.groups||[]).find(x=>x.id===selG);
  if(!g||!g.students) g&&(g.students=[]);
  if(!g) return;
  if(sid){const s=g.students.find(x=>x.id===sid);if(s&&val){s.name=val;sched();}}
  else if(val){
    const ns=newStudent(val);
    g.students.push(ns);
    if(!D.students.find(x=>x.name.toLowerCase()===val.toLowerCase()))
      D.students.push({id:ns.id,name:val,status:'active',createdAt:new Date().toISOString().split('T')[0]});
    sched();setTimeout(()=>renderGroup(document.getElementById('main')),100);
  }
}

function updateNotifBadge(){
  if(curUser?.role!=='admin') return;
  const notifs=(D.settings?.notifications||[]);
  const unread=notifs.filter(n=>!n.read).length;
  const bell=document.getElementById('notif-bell');
  const badge=document.getElementById('notif-badge');
  if(bell) bell.style.display='flex';
  if(badge){
    badge.style.display=unread>0?'block':'none';
    badge.textContent=unread>9?'9+':String(unread);
  }
}

function showNotifications(){
  const notifs=(D.settings?.notifications||[]);
  const typeIcon={hide:'👁',delete:'🗑️',archive:'📦'};
  const typeName={hide:'Скрыт',delete:'Удалён',archive:'Архивирован'};
  const typeColor={hide:'#FAEEDA',delete:'#ffebee',archive:'#e3f2fd'};
  const typeText={hide:'#633806',delete:'#b71c1c',archive:'#1565c0'};

  openModal(`<div class="modal-title">🔔 Уведомления</div>
    ${!notifs.length
      ?`<div style="text-align:center;padding:20px;color:#bbb">Уведомлений нет</div>`
      :`<div style="display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow-y:auto">
        ${notifs.map(n=>`
          <div style="padding:12px;border-radius:10px;background:${n.read?'var(--color-background-secondary)':'var(--color-background-primary)'};border:1px solid ${n.read?'var(--color-border-tertiary)':'var(--color-border-secondary)'}">
            <div style="display:flex;align-items:flex-start;gap:10px">
              <span style="font-size:18px">${typeIcon[n.type]||'ℹ️'}</span>
              <div style="flex:1">
                <div style="font-size:13px;font-weight:${n.read?400:600};color:var(--color-text-primary)">${n.text}</div>
                ${n.data?.groupName?`<div style="font-size:11px;color:var(--color-text-secondary);margin-top:2px">Группа: ${n.data.groupName}</div>`:''}
                ${n.data?.reason?`<div style="font-size:11px;color:var(--color-text-secondary)">Причина: ${n.data.reason}</div>`:''}
                <div style="font-size:11px;color:var(--color-text-secondary);margin-top:4px">${n.date} ${n.time}</div>
              </div>
              <span style="font-size:11px;padding:2px 8px;border-radius:10px;background:${typeColor[n.type]||'#f5f5f5'};color:${typeText[n.type]||'#666'};white-space:nowrap">${typeName[n.type]||n.type}</span>
            </div>
          </div>`).join('')}
      </div>`}
    <div class="fa">
      ${notifs.some(n=>!n.read)?`<button class="btn btn-sec btn-sm" onclick="markAllNotifsRead()">Отметить все прочитанными</button>`:''}
      ${notifs.length?`<button class="btn btn-dan btn-sm" onclick="clearNotifs()">Очистить всё</button>`:''}
      <button class="btn btn-sec" onclick="closeModal()">Закрыть</button>
    </div>`);
  // Mark all as read
  (D.settings?.notifications||[]).forEach(n=>n.read=true);
  sched();updateNotifBadge();
}

function markAllNotifsRead(){
  (D.settings?.notifications||[]).forEach(n=>n.read=true);
  sched();closeModal();updateNotifBadge();
}

function clearNotifs(){
  if(!confirm('Очистить все уведомления?')) return;
  if(D.settings) D.settings.notifications=[];
  sched();closeModal();updateNotifBadge();
}

function addAdminNotification(type, text, data){
  if(!D.settings) D.settings={};
  if(!D.settings.notifications) D.settings.notifications=[];
  D.settings.notifications.unshift({
    id:uid(),type,text,
    data:data||{},
    date:new Date().toISOString().slice(0,10),
    time:new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'}),
    by:curUser?.name||'Преподаватель',
    read:false
  });
  if(D.settings.notifications.length>100) D.settings.notifications=D.settings.notifications.slice(0,100);
  // Save immediately so admin sees it right away
  saveData();
}

function confirmHideStudent(sid){
  const t=D.teachers.find(x=>x.id===selT);
  const g=(t?.groups||[]).find(x=>x.id===selG);if(!g) return;
  const s=(g.students||[]).find(x=>x.id===sid);if(!s) return;
  const reason=document.getElementById('hide-reason')?.value?.trim()||'Не указана';
  s.hidden=true;s.hideReason=reason;s.hiddenBy=curUser?.name||'Преподаватель';
  addAdminNotification('hide',
    `${curUser?.name||'Преподаватель'} скрыл студента ${s.name}`,
    {studentName:s.name,groupName:`${t.name} — ${lvl(g.level)} ${g.day} ${g.time}`,reason,teacherName:t.name}
  );
  closeModal();renderGroup(document.getElementById('main'));sched();toast('Студент скрыт','success');
}

function unhideStudent(sid){
  const t=D.teachers.find(x=>x.id===selT);
  const g=(t?.groups||[]).find(x=>x.id===selG);if(!g) return;
  const s=(g.students||[]).find(x=>x.id===sid);if(!s) return;
  s.hidden=false;delete s.hideReason;delete s.hiddenBy;
  renderGroup(document.getElementById('main'));sched();toast('Студент восстановлен ✓','success');
}

function adminArchiveHidden(sid,tid,gid){
  const t=D.teachers.find(x=>x.id===tid);
  const g=(t?.groups||[]).find(x=>x.id===gid);if(!g) return;
  const s=(g.students||[]).find(x=>x.id===sid);if(!s) return;
  if(!D.archives) D.archives=[];
  const arch=D.archives.find(a=>a.label==='Скрытые студенты')||{id:uid(),label:'Скрытые студенты',date:new Date().toLocaleDateString('ru'),teachers:[]};
  if(!D.archives.includes(arch)) D.archives.push(arch);
  let at=arch.teachers.find(x=>x.id===tid);
  if(!at){at={id:tid,name:t.name,groups:[]};arch.teachers.push(at);}
  let ag=at.groups.find(x=>x.id===gid);
  if(!ag){ag={...g,students:[]};at.groups.push(ag);}
  ag.students.push({...s});
  g.students=g.students.filter(x=>x.id!==sid);
  renderAll();sched();toast('Студент архивирован ✓','success');
}

function adminRestoreHidden(sid,tid,gid){
  const t=D.teachers.find(x=>x.id===tid);
  const g=(t?.groups||[]).find(x=>x.id===gid);if(!g) return;
  const s=(g.students||[]).find(x=>x.id===sid);if(!s) return;
  s.hidden=false;delete s.hideReason;delete s.hiddenBy;
  renderAll();sched();toast('Студент восстановлен ✓','success');
}

    ?RUS_LEVELS.map(l=>`<option value="${l}" ${l===nextLevel?'selected':''}>${lvl(l)}</option>`).join('')

    <div class="fg"><label class="fl">Название архива</label>
      <input type="text" class="fi" id="prm-label" value="${new Date().toLocaleDateString('ru')} — ${g.day} ${g.time} ${lvl(g.level)}">
    </div>
    <div style="background:#f0fdf4;border-radius:12px;padding:14px;margin-bottom:16px">
      <div style="font-size:13px;font-weight:600;color:#166534;margin-bottom:10px">🔼 Перевести студентов на следующий уровень</div>
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;margin-bottom:10px">
        <input type="checkbox" id="prm-transfer" checked style="accent-color:#4361ee">
        Создать новую группу со студентами
      </label>
      <div id="prm-next-opts">
        <div class="fg" style="margin-bottom:8px"><label class="fl">Следующий уровень</label>
          <select class="fi" id="prm-next-level">${nextLevelOptions}</select>
        </div>
        <div style="display:flex;gap:8px">
          <div class="fg" style="flex:1;margin-bottom:0"><label class="fl">Расписание</label>
            <div style="display:flex;gap:6px">
              <label style="flex:1;display:flex;align-items:center;gap:5px;padding:7px 10px;border:1.5px solid #e0e4f0;border-radius:8px;cursor:pointer;font-size:12px">
                <input type="radio" name="prm-day" value="${g.day}" checked> ${g.day}
              </label>
            </div>
          </div>
          <div class="fg" style="flex:1;margin-bottom:0"><label class="fl">Время</label>
            <select class="fi" id="prm-time">
              ${(TIMES||['09:00','10:30','14:00','15:30','17:00','18:30']).map(tm=>`<option ${tm===g.time?'selected':''}>${tm}</option>`).join('')}
            </select>
          </div>
        </div>
      </div>
    </div>
    <div class="fa">
      <button class="btn btn-sec" onclick="closeModal()">Отмена</button>
      <button class="btn btn-pri" onclick="promoteGroup()">🎓 Завершить</button>
    </div>`);
  // Toggle next group options
  document.getElementById('prm-transfer').addEventListener('change',function(){
    document.getElementById('prm-next-opts').style.display=this.checked?'block':'none';
  });
  setTimeout(()=>document.getElementById('prm-label')?.focus(),80);
}

function promoteGroup(){
  const t=D.teachers.find(x=>x.id===selT);
  const g=(t?.groups||[]).find(x=>x.id===selG);if(!g) return;
  const label=document.getElementById('prm-label')?.value?.trim()||'Архив';
  const transfer=document.getElementById('prm-transfer')?.checked;
  const nextLevel=document.getElementById('prm-next-level')?.value;
  const nextTime=document.getElementById('prm-time')?.value||g.time;
  const nextDay=g.day;

  // Archive current group
  const snap=JSON.parse(JSON.stringify([t]));
  if(!D.archives) D.archives=[];
  D.archives.push({id:uid(),label,date:new Date().toLocaleDateString('ru'),teachers:snap});

  // Get students before removing group
  const students=transfer&&nextLevel?(g.students||[]).filter(s=>s&&s.name&&!s.hidden).map(s=>({
    ...newStudent(s.name), // fresh grades
    id:uid(),
    name:s.name
  })):[];

  // Remove group
  t.groups=t.groups.filter(x=>x.id!==selG);

  // Create new group with students if requested
  if(transfer&&nextLevel&&students.length){
    if(!t.groups) t.groups=[];
    const newG={id:uid(),level:nextLevel,day:nextDay,time:nextTime,students};
    t.groups.push(newG);
    selG=newG.id;selT=t.id;view='group';
    try{localStorage.removeItem(LOCAL_KEY);}catch(e){}
    closeModal();renderAll();
    saveData().then(()=>toast(`Группа завершена. Создана новая группа ${lvl(nextLevel)} с ${students.length} студентами ✓`,'success'));
  } else {
    selG=null;view='teacher';
    try{localStorage.removeItem(LOCAL_KEY);}catch(e){}
    closeModal();renderAll();
    saveData().then(()=>toast('Группа завершена и архивирована ✓','success'));
  }
}

function delStudent(sid){
  if(!sid||!confirm('Удалить студента из группы?')) return;
  const t=D.teachers.find(x=>x.id===selT);
  const g=(t?.groups||[]).find(x=>x.id===selG);if(!g) return;
  const s=(g.students||[]).find(x=>x.id===sid);
  if(s) addAdminNotification('delete',
    `${curUser?.name||'Преподаватель'} удалил студента ${s.name}`,
    {studentName:s.name,groupName:`${t.name} — ${lvl(g.level)} ${g.day} ${g.time}`,teacherName:t.name}
  );
  g.students=g.students.filter(x=>x.id!==sid);
  renderGroup(document.getElementById('main'));sched();
}

function archiveStudent(sid){
  const t=D.teachers.find(x=>x.id===selT);
  const g=(t?.groups||[]).find(x=>x.id===selG);
  const s=g?.students?.find(x=>x.id===sid);if(!s) return;
  const fv=calcFinal(s,g.level);
  openModal(`<div class="modal-title">📦 Архивировать студента</div>
    <div class="modal-desc"><b>${s.name}</b> будет перемещён в архив. Оценки сохранятся.</div>
    <div style="background:#f8f9fb;border-radius:10px;padding:14px;margin-bottom:16px;text-align:center">
      <div style="font-size:12px;color:#888;margin-bottom:4px">Overall</div>
      <div class="ob ${fv===null?'on':fv>=75?'og':fv>=70?'oy':'or'}" style="font-size:20px">${fv!==null?fv.toFixed(1):'—'}</div>
    </div>
    <div class="fa"><button class="btn btn-sec" onclick="closeModal()">${tr('cancel')}</button>
      <button class="btn btn-ora" onclick="doArchiveStu('${sid}')">📦 В архив</button></div>`);
}
function doArchiveStu(sid){
  const t=D.teachers.find(x=>x.id===selT);
  const g=(t?.groups||[]).find(x=>x.id===selG);if(!g) return;
  const s=g.students.find(x=>x.id===sid);if(!s) return;
  if(!g.archived_students) g.archived_students=[];
  g.archived_students.push({...s,archived_at:new Date().toISOString()});
  g.students=g.students.filter(x=>x.id!==sid);
  const gs=D.students.find(x=>x.id===sid||x.name===s.name);
  if(gs) gs.status='archived';
  addAdminNotification('archive',
    `${curUser?.name||'Преподаватель'} архивировал студента ${s.name}`,
    {studentName:s.name,groupName:`${t.name} — ${lvl(g.level)} ${g.day} ${g.time}`,teacherName:t.name}
  );
  closeModal();renderGroup(document.getElementById('main'));sched();toast(`${s.name} архивирован ✓`,'success');
}

function showMoveStudent(sid){
  const t=D.teachers.find(x=>x.id===selT);
  const g=(t?.groups||[]).find(x=>x.id===selG);
  const s=g?.students?.find(x=>x.id===sid);if(!s) return;
  const opts=[];
  D.teachers.forEach(tc=>(tc.groups||[]).forEach(gr=>{if(gr.id!==selG) opts.push({t:tc,g:gr});}));
  openModal(`<div class="modal-title">↗ Перенести студента</div>
    <div class="modal-desc">Куда перенести <b>${s.name}</b>?</div>
    <div style="max-height:320px;overflow-y:auto">
      ${opts.map(({t:tc,g:gr})=>`<div class="gc-choice" onclick="doMove('${sid}','${gr.id}')">
        <div class="t-av" style="width:32px;height:32px;font-size:11px;border-radius:8px">${ini(tc.name)}</div>
        <div><div style="font-size:13px;font-weight:700">${tc.name}</div>
          <div style="font-size:12px;color:#888">${gr.day} ${gr.time} · <span class="lp lv-${lvc(gr.level)}" style="padding:1px 7px">${lvl(gr.level)}</span></div>
        </div></div>`).join('')||'<div style="text-align:center;padding:20px;color:#bbb">'+tr('noGroups')+'</div>'}
    </div>
    <div class="fa"><button class="btn btn-sec" onclick="closeModal()">${tr('cancel')}</button></div>`);
}
function doMove(sid,targetGid){
  const t=D.teachers.find(x=>x.id===selT);
  const g=(t?.groups||[]).find(x=>x.id===selG);
  const s=g?.students?.find(x=>x.id===sid);if(!s) return;
  let tgt=null;D.teachers.forEach(tc=>(tc.groups||[]).forEach(gr=>{if(gr.id===targetGid) tgt=gr;}));
  if(!tgt) return;
  if(!tgt.students) tgt.students=[];
  tgt.students.push({...s,id:uid()});
  g.students=g.students.filter(x=>x.id!==sid);
  closeModal();renderGroup(document.getElementById('main'));sched();toast(`${s.name} перенесён ✓`,'success');
}

function clickStudent(sid){
  const found=[];
  D.teachers.forEach(t=>(t.groups||[]).forEach(g=>{
    const s=(g.students||[]).find(x=>x.id===sid);
    if(s) found.push({t,g,s});
  }));
  if(!found.length) return;
  if(found.length===1){selT=found[0].t.id;selG=found[0].g.id;view='group';renderAll();}
  else{
    openModal(`<div class="modal-title">Студент в нескольких группах</div>
      <div class="modal-desc">Выберите группу:</div>
      ${found.map(({t,g})=>`<div class="gc-choice" onclick="selT='${t.id}';selG='${g.id}';view='group';renderAll();closeModal()">
        <div class="t-av" style="width:32px;height:32px;font-size:11px;border-radius:8px">${ini(t.name)}</div>
        <div><div style="font-size:13px;font-weight:700">${t.name}</div>
          <div style="font-size:12px;color:#888">${g.day} ${g.time} · <span class="lp lv-${lvc(g.level)}" style="padding:1px 7px">${lvl(g.level)}</span></div>
        </div></div>`).join('')}
      <div class="fa"><button class="btn btn-sec" onclick="closeModal()">${tr('cancel')}</button></div>`);
  }
}

  const stus=D.students||[];
  el.innerHTML=`
    <div class="ph">
      <div><div class="pt">${tr('stuBase')}</div><div class="ps">${stus.length} ${tr('stuCount')}</div></div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-pri btn-sm" onclick="showAddStudentGlobal()">+ Добавить</button>
      </div>
    </div>
    <div class="card">
      <input type="text" class="fi" placeholder="Поиск студента..." style="margin-bottom:16px" oninput="filterStudentsList(this.value)">
      <div id="stu-list">
        ${!stus.length?`<div class="empty"><h3>База пуста</h3><p>Студенты добавляются автоматически при добавлении в группу</p></div>`:''}
        ${stus.map(s=>{
          const groups=findStudentGroups(s.id,s.name);
          return `<div class="acc-row" data-sname="${s.name.toLowerCase()}">
            <div class="t-av stu" style="width:38px;height:38px;font-size:13px;border-radius:10px">${ini(s.name)}</div>
            <div class="acc-info">
              <div class="acc-name" style="cursor:pointer;color:#4361ee" onclick="viewStudentProfile('${s.id}')">${s.name}</div>
              <div class="acc-login">${groups.length?groups.map(({t,g})=>`${t.name} · ${g.day} ${g.time}`).join(' | '):'Не в группе'}</div>
            </div>
            <span class="status-pill ${s.status==='active'?'sp-active':s.status==='archived'?'sp-archived':'sp-graduated'}">${s.status==='active'?'Активен':s.status==='archived'?'Архив':'Выпускник'}</span>
            <button class="btn btn-pri btn-sm" onclick="showAssignToGroup('${s.id}')">↗ В группу</button>
          </div>`;
        }).join('')}
      </div>
    </div>`;
}
function filterStudentsList(q){
  document.querySelectorAll('#stu-list [data-sname]').forEach(el=>{
    el.style.display=!q||el.dataset.sname.includes(q.toLowerCase())?'flex':'none';
  });
}
function findStudentGroups(sid,sname){
  const res=[];
  D.teachers.forEach(t=>(t.groups||[]).forEach(g=>{
    const s=(g.students||[]).find(x=>x.id===sid||x.name===sname);
    if(s) res.push({t,g,s});
  }));
  return res;
}
function showAddStudentGlobal(){
  openModal(`<div class="modal-title">Новый студент</div>
    <div class="fg"><label class="fl">Имя и фамилия</label>
      <input type="text" class="fi" id="sn" placeholder="Иванов Иван" onkeydown="if(event.key==='Enter')addStudentGlobal()">
    </div>
    <div class="fa"><button class="btn btn-sec" onclick="closeModal()">${tr('cancel')}</button>
      <button class="btn btn-pri" onclick="addStudentGlobal()">${tr('addBtn')}</button></div>`);
  setTimeout(()=>document.getElementById('sn')?.focus(),80);
}
function addStudentGlobal(){
  const n=document.getElementById('sn')?.value?.trim();if(!n) return;
  if(D.students.find(x=>x.name.toLowerCase()===n.toLowerCase())){toast('Уже есть в базе','error');return;}
  D.students.push({id:uid(),name:n,status:'active',createdAt:new Date().toISOString().split('T')[0]});
  closeModal();renderStudentsPage(document.getElementById('main'));sched();toast('Добавлен ✓','success');
}
function showAssignToGroup(stuId){
  const stu=D.students.find(x=>x.id===stuId);if(!stu) return;
  const opts=[];
  D.teachers.forEach(tc=>(tc.groups||[]).forEach(gr=>opts.push({t:tc,g:gr})));
  openModal(`<div class="modal-title">↗ Добавить в группу</div>
    <div class="modal-desc">Куда добавить <b>${stu.name}</b>?</div>
    <div style="max-height:340px;overflow-y:auto">
      ${opts.map(({t,g})=>`<div class="gc-choice" onclick="doAssignToGroup('${stuId}','${g.id}')">
        <div class="t-av" style="width:32px;height:32px;font-size:11px;border-radius:8px">${ini(t.name)}</div>
        <div><div style="font-size:13px;font-weight:700">${t.name}</div>
          <div style="font-size:12px;color:#888">${g.day} ${g.time} · <span class="lp lv-${lvc(g.level)}" style="padding:1px 7px">${lvl(g.level)}</span></div>
        </div></div>`).join('')}
    </div>
    <div class="fa"><button class="btn btn-sec" onclick="closeModal()">${tr('cancel')}</button></div>`);
}
function doAssignToGroup(stuId,gid){
  const stu=D.students.find(x=>x.id===stuId);if(!stu) return;
  let tgt=null;D.teachers.forEach(tc=>(tc.groups||[]).forEach(gr=>{if(gr.id===gid) tgt=gr;}));
  if(!tgt) return;
  if(!tgt.students) tgt.students=[];
  if(tgt.students.find(s=>s.name===stu.name)){toast('Уже в этой группе','error');return;}
  tgt.students.push(newStudent(stu.name));
  closeModal();renderStudentsPage(document.getElementById('main'));sched();toast(`${stu.name} добавлен в группу ✓`,'success');
}

async function saveStudentAccount(stuId,stuName){
  const login=document.getElementById('stu-login')?.value?.trim();
  const pass=document.getElementById('stu-pass')?.value?.trim();
  if(!login){toast('Введите логин','error');return;}
  if(!D.accounts) D.accounts=[];
  const existing=(D.accounts||[]).find(a=>a.role==='student'&&a.studentId===stuId);
  // Password required only for new accounts
  if(!existing&&!pass){toast('Введите пароль','error');return;}
  if(pass&&pass.length<4){toast('Пароль минимум 4 символа','error');return;}
  const conflict=(D.accounts||[]).find(a=>a.login===login&&a.studentId!==stuId);
  if(conflict){toast('Логин уже занят','error');return;}
  const hashed=pass?await hashPass(pass):(existing?.password||'');
  D.accounts=D.accounts.filter(a=>!(a.role==='student'&&a.studentId===stuId));
  D.accounts.push({id:uid(),role:'student',studentId:stuId,studentName:stuName,login,password:hashed});
  closeModal();sched();
  toast(pass?`✅ Доступ открыт! Логин: ${login} · Пароль: ${pass}`:`✅ Логин обновлён: ${login}`,'success');
}

function closeStudentAccount(stuId){
  if(!confirm('Закрыть доступ студенту?')) return;
  D.accounts=(D.accounts||[]).filter(a=>!(a.role==='student'&&a.studentId===stuId));
  closeModal();sched();toast('Доступ закрыт','success');
}

function changeStudentStatus(sid,status){
  const s=D.students.find(x=>x.id===sid);if(s) s.status=status;sched();toast('Статус обновлён','success');
}

async function editAccount(id){
  const a=D.accounts.find(x=>x.id===id);if(!a) return;
  const tc=D.teachers.find(x=>x.id===a.teacherId);
  const login=document.getElementById('ac-l')?.value?.trim();
  const pass=document.getElementById('ac-p')?.value?.trim();
  if(login) a.login=login;
  if(pass&&pass.length>=4) a.password=await hashPass(pass);
  // Save teacher fields
  if(tc){
    const tname=document.getElementById('ac-tname')?.value?.trim();
    if(tname) tc.name=tname;
    const tphone=document.getElementById('ac-tphone')?.value?.trim();
    if(tphone!==undefined) tc.phone=tphone;
    const tlang=document.querySelector('input[name="ac-tlang"]:checked')?.value;
    if(tlang) tc.lang=tlang;
  }
  if(a.role==='supporter'){
    const newType=document.querySelector('input[name="edit-sup-type"]:checked')?.value;
    if(newType) a.supType=newType;
    const newSchedule=document.querySelector('input[name="edit-sup-schedule"]:checked')?.value;
    if(newSchedule) a.schedule=newSchedule;
    const ph=document.getElementById('ac-phone')?.value?.trim();
    if(ph!==undefined) a.phone=ph;
    if(!a.demos) a.demos={};
    if(!a.replacements) a.replacements=[];
    if(!a.mockTests) a.mockTests=[];
    if(!a.reports) a.reports=[];
  }
  closeModal();renderAccounts(document.getElementById('main'));sched();toast('Обновлено ✓','success');
}
function delAccount(id){
  if(!confirm('Удалить аккаунт?')) return;
  D.accounts=D.accounts.filter(x=>x.id!==id);
  closeModal();renderAccounts(document.getElementById('main'));sched();
}

function gradeKey(e,inp){
  const nav={'Enter':1,'Tab':1,'ArrowRight':1,'ArrowLeft':1,'ArrowUp':1,'ArrowDown':1};
  if(!nav[e.key]) return;
  e.preventDefault();
  const row=inp.closest('tr');
  const rows=[...document.querySelectorAll('tbody tr')];
  const ri=rows.indexOf(row);
  const allInRow=[...row.querySelectorAll('input.gi')];
  const ci=allInRow.indexOf(inp);

  let targetInput=null;

  if(e.key==='ArrowRight'||(e.key==='Tab'&&!e.shiftKey)||e.key==='Enter'){
    if(ci>=0&&ci<allInRow.length-1){
      targetInput=allInRow[ci+1];
    } else if(ri>=0&&ri<rows.length-1){
      targetInput=rows[ri+1].querySelector('input.gi');
    }
  } else if(e.key==='ArrowLeft'||(e.key==='Tab'&&e.shiftKey)){
    if(ci>0){
      targetInput=allInRow[ci-1];
    } else if(ri>0){
      const prevRow=rows[ri-1];
      const prevInputs=[...prevRow.querySelectorAll('input.gi')];
      targetInput=prevInputs[prevInputs.length-1]||null;
    }
  } else if(e.key==='ArrowDown'){
    if(ri>=0&&ri<rows.length-1){
      const nextInputs=[...rows[ri+1].querySelectorAll('input.gi')];
      targetInput=nextInputs[ci]||nextInputs[nextInputs.length-1]||null;
    }
  } else if(e.key==='ArrowUp'){
    if(ri>0){
      const prevInputs=[...rows[ri-1].querySelectorAll('input.gi')];
      targetInput=prevInputs[ci]||prevInputs[prevInputs.length-1]||null;
    }
  }

  if(targetInput){
    inp.blur(); // ensure current value is saved
    // Highlight active row
    rows.forEach(r=>r.classList.remove('active-row'));
    targetInput.closest('tr')?.classList.add('active-row');
    targetInput.classList.add('active-nav');
    targetInput.focus();
    targetInput.select();
    setTimeout(()=>{
      targetInput.scrollIntoView({block:'nearest',inline:'nearest'});
    },0);
  }
}

function previewExcel(input){
  const file=input.files[0];if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      if(rows.length<2){toast('Файл пустой','error');return;}
      const hdr=rows[0];
      // Find column indices
      const col=name=>hdr.findIndex(h=>String(h).trim().toLowerCase()===name.toLowerCase());
      const nameCol=col('Студент');
      if(nameCol<0){toast('Не найден столбец "Студент"','error');return;}
      _xlData={rows:rows.slice(1),hdr,nameCol};
      // Preview
      const t=D.teachers.find(x=>x.id===selT);
      const g=(t?.groups||[]).find(x=>x.id===selG);
      const dataRows=rows.slice(1).filter(r=>r[nameCol]&&String(r[nameCol]).trim());
      const matched=dataRows.filter(r=>(g.students||[]).find(s=>s.name===String(r[nameCol]).trim()));
      const notFound=dataRows.filter(r=>!(g.students||[]).find(s=>s.name===String(r[nameCol]).trim()));
      document.getElementById('xl-info').innerHTML=`
        <div style="color:#1b5e20;font-weight:700;margin-bottom:6px">✅ Совпадений: ${matched.length} ${tr('stuCount')}</div>
        ${notFound.length?`<div style="color:#e65100;margin-bottom:6px">⚠️ Не найдено в группе (${notFound.length}): ${notFound.map(r=>r[nameCol]).join(', ')}</div>`:''}
        <div style="color:#555">Заполненные ячейки будут обновлены. Пустые ячейки останутся без изменений.</div>`;

function doUploadExcel(){
  if(!_xlData) return;
  const t=D.teachers.find(x=>x.id===selT);
  const g=(t?.groups||[]).find(x=>x.id===selG);if(!g) return;
  const {rows,hdr,nameCol}=_xlData;
  const col=name=>hdr.findIndex(h=>String(h).trim().toLowerCase()===name.toLowerCase());
  const getNum=(row,name)=>{const i=col(name);if(i<0) return null;const v=row[i];return v!==''&&v!==null&&v!==undefined?parseFloat(v):null;};
  let updated=0;
  const isRusGrp=RUS_LEVELS.includes(g.level);
  const rusCfg=isRusGrp?(RUS_CFG[g.level]||RUS_CFG['rus-1']):null;
  rows.forEach(row=>{
    const name=String(row[nameCol]||'').trim();if(!name) return;
    const s=(g.students||[]).find(x=>x.name===name);if(!s) return;
    if(isRusGrp){
      if(!s.conversations) s.conversations=Array(rusCfg.conv).fill(null);
      if(!s.homework) s.homework=Array(rusCfg.hw).fill(null);
      if(!s.vocabulary) s.vocabulary=Array(rusCfg.vocab).fill(null);
      if(!s.presentations) s.presentations=Array(rusCfg.ppt).fill(null);
      for(let i=1;i<=rusCfg.conv;i++){const v=getNum(row,`Р${i}`);if(v!==null) s.conversations[i-1]=v;}
      for(let i=1;i<=rusCfg.hw;i++){const v=getNum(row,`ДЗ${i}`);if(v!==null) s.homework[i-1]=v;}
      for(let i=1;i<=rusCfg.vocab;i++){const v=getNum(row,`Словарь${i}`);if(v!==null) s.vocabulary[i-1]=v;}
      for(let i=1;i<=rusCfg.ppt;i++){const v=getNum(row,`Презентация${i}`);if(v!==null) s.presentations[i-1]=v;}
      const fc=getNum(row,'Зак.разговорка');if(fc!==null) s.finalConversation=fc;
      if(rusCfg.hasFinalTest){const ft=getNum(row,'Зак.тест');if(ft!==null) s.finalTest=ft;}
    } else {
      if(!s.units) s.units=Array(12).fill(null);
      if(!s.homework) s.homework=Array(5).fill(null);
      if(!s.achievements) s.achievements=Array(5).fill(null);
      for(let i=1;i<=12;i++){const v=getNum(row,`U${i}`);if(v!==null) s.units[i-1]=v;}
      for(let i=1;i<=5;i++){const v=getNum(row,`HW${i}`);if(v!==null) s.homework[i-1]=v;}
      for(let i=1;i<=5;i++){const v=getNum(row,`AT${i}`);if(v!==null) s.achievements[i-1]=v;}
      const ppt=getNum(row,'PPT');if(ppt!==null) s.presentation=ppt;
      const spt=getNum(row,'SPT');if(spt!==null) s.speaking=spt;
      const fin=getNum(row,'Final');if(fin!==null) s.final=fin;
      const ret=getNum(row,'Retake');if(ret!==null) s.retake=ret;
    }
    updated++;
  });
  _xlData=null;
  closeModal();renderGroup(document.getElementById('main'));sched();
  toast(`Обновлено ${updated} студентов ✓`,'success');
}

function sheetData(g){
  if(RUS_LEVELS.includes(g.level)){
    const cfg=RUS_CFG[g.level]||RUS_CFG['rus-1'];
    const convH=Array(cfg.conv).fill(0).map((_,i)=>`Р${i+1}`);
    const hwH=Array(cfg.hw).fill(0).map((_,i)=>`ДЗ${i+1}`);
    const vocH=Array(cfg.vocab).fill(0).map((_,i)=>`Словарь${i+1}`);
    const pptH=Array(cfg.ppt).fill(0).map((_,i)=>`Презентация${i+1}`);
    const h=['#','Студент',...convH,...hwH,...vocH,...pptH,'Зак.разговорка',...(cfg.hasFinalTest?['Зак.тест']:[]),'Overall'];
    const rows=(g.students||[]).filter(s=>s.name).map((s,i)=>{
      const ov=calc(s,g.level);
      return [i+1,s.name,
        ...(s.conversations||Array(cfg.conv).fill(null)).map(v=>v??''),
        ...(s.homework||Array(cfg.hw).fill(null)).map(v=>v??''),
        ...(s.vocabulary||Array(cfg.vocab).fill(null)).map(v=>v??''),
        ...(s.presentations||Array(cfg.ppt).fill(null)).map(v=>v??''),
        s.finalConversation??'',
        ...(cfg.hasFinalTest?[s.finalTest??'']:[]),
        ov!==null?parseFloat(ov.toFixed(1)):''
      ];
    });
    return [h,...rows];
  }
  const h=['#','Студент','U1','U2','U3','U4','U5','U6','U7','U8','U9','U10','U11','U12','HW1','HW2','HW3','HW4','HW5','AT1','AT2','AT3','AT4','AT5','PPT','SPT','Final','Overall','Retake'];
  const rows=(g.students||[]).filter(s=>s.name).map((s,i)=>{
    const ov=calc(s,g.level);
    const r=s.retake!=null&&s.retake!==''?Number(s.retake):null;
    const fv=ov!==null?(ov+(r||0)):(r!==null?r:null);
    return [i+1,s.name,...(s.units||[]).map(v=>v??''),...(s.homework||[]).map(v=>v??''),...(s.achievements||[]).map(v=>v??''),s.presentation??'',s.speaking??'',s.final??'',fv!==null?parseFloat(fv.toFixed(1)):'',s.retake??''];
  });
  return [h,...rows];
}

function getDebts(s,level){
    const debts=[];
    // filled = has any value including 0; passed = has value > 0
    const filled=v=>v!==null&&v!==undefined&&v!=='';
    const passed=v=>filled(v)&&Number(v)>0;

    // Russian language debt detection
    if(RUS_LEVELS&&RUS_LEVELS.includes(level)){
      const cfg=RUS_CFG&&RUS_CFG[level];
      if(!cfg) return debts;
      const convs=s.conversations||[];
      const hws=s.homework||[];
      const vocabs=s.vocabulary||[];
      for(let i=0;i<cfg.conv;i++){
        // 0 in any cell = debt regardless of other cells
        if(filled(convs[i])&&Number(convs[i])===0) debts.push({key:'u',label:`Р${i+1}`});
        if(filled(hws[i])&&Number(hws[i])===0)     debts.push({key:'hw',label:`ДЗ${i+1}`});
        if(filled(vocabs[i])&&Number(vocabs[i])===0) debts.push({key:'at',label:`Сл${i+1}`});
        // If conversation passed but HW or Vocab missing
        if(passed(convs[i])){
          if(!filled(hws[i]))   debts.push({key:'hw',label:`ДЗ${i+1}`});
          if(!filled(vocabs[i])) debts.push({key:'at',label:`Сл${i+1}`});
        }
      }
      return debts;
    }

    const startU=(s.startUnit||1)-1;
    const startA=(s.startAT||1)-1;

    // Unit Tests: 0 = debt; empty after later filled = debt
    const units=s.units||Array(12).fill(null);
    let lastFilledUnit=-1;
    for(let i=11;i>=0;i--){if(filled(units[i])){lastFilledUnit=i;break;}}
    for(let i=startU;i<=lastFilledUnit;i++){
      if(!filled(units[i])) debts.push({key:'u',label:`U${i+1}`});         // empty gap
      else if(Number(units[i])===0) debts.push({key:'u',label:`U${i+1}`}); // zero
    }

    // Achievement Tests: 0 = debt; empty after later filled = debt
    const ats=s.achievements||Array(5).fill(null);
    let lastFilledAT=-1;
    for(let i=4;i>=0;i--){if(filled(ats[i])){lastFilledAT=i;break;}}
    for(let i=startA;i<=lastFilledAT;i++){
      if(!filled(ats[i])) debts.push({key:'at',label:`AT${i+1}`});
      else if(Number(ats[i])===0) debts.push({key:'at',label:`AT${i+1}`});
    }

    // Homework <-> AT bidirectional check
    const hws=s.homework||Array(5).fill(null);
    let lastFilledHW=-1;
    for(let i=4;i>=0;i--){if(filled(hws[i])){lastFilledHW=i;break;}}
    for(let i=startA;i<=Math.max(lastFilledAT,lastFilledHW);i++){
      const hasAT=filled(ats[i])&&Number(ats[i])!==0;
      const hasHW=filled(hws[i])&&Number(hws[i])!==0;
      const zeroAT=filled(ats[i])&&Number(ats[i])===0;
      const zeroHW=filled(hws[i])&&Number(hws[i])===0;
      // AT done but HW missing or zero
      if(hasAT&&!filled(hws[i])) debts.push({key:'hw',label:`HW${i+1}`});
      if(hasAT&&zeroHW&&!debts.find(d=>d.label===`HW${i+1}`)) debts.push({key:'hw',label:`HW${i+1}`});
      // HW done but AT missing
      if(hasHW&&!filled(ats[i])&&i<=lastFilledAT) debts.push({key:'at',label:`AT${i+1} (нет)`});
      // Zero in HW
      if(zeroHW&&!debts.find(d=>d.label===`HW${i+1}`)) debts.push({key:'hw',label:`HW${i+1}`});
    }

    return debts;
  }

    const dow=new Date(yr,mo-1,d).getDay();

  el.innerHTML=`
    <div class="bc"><span class="bc-l" onclick="goHome()">Главная</span><span class="bc-s">›</span><span class="bc-c">Расписание дежурств</span></div>
    <div class="ph">
      <div><div class="pt">📅 Расписание дежурств</div><div class="ps">Утро 12:00–13:00 · Послеобед 13:00–19:00</div></div>
      ${isAdmin()?`<div style="display:flex;gap:8px">

        <option value="">Все суппортеры</option>
        ${supporters.map(a=>`<option value="${a.id}" ${filterSup===a.id?'selected':''}>${a.name}</option>`).join('')}
      </select>
      ${filterSup?`<button onclick="window._dutyFilterSup='';renderMain()" style="padding:5px 12px;border-radius:8px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);cursor:pointer;font-size:13px">✕</button>`:''}

function saveDemoFeedback(supId,level){
  const a=(D.accounts||[]).find(x=>x.id===supId);if(!a) return;
  const text=document.getElementById('demo-fb-text')?.value?.trim();
  const date=document.getElementById('demo-fb-date')?.value;
  if(!text){toast('Введите фидбек','error');return;}
  if(!a.demos) a.demos={};
  a.demos[level+'_feedback']=text;
  a.demos[level+'_feedback_date']=date?new Date(date).toLocaleDateString('ru'):'';
  a.demos[level]=true;
  closeModal();sched();renderAll();toast('Фидбек сохранён ✓','success');
}

}

function debtRow(r,dbg){
  return `<div style="display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:0.5px solid var(--color-border-tertiary)">
    <div style="flex:1;min-width:0">

      <div style="font-size:11px;color:var(--color-text-secondary);margin-top:2px">${r.tc.name} · ${r.g.day} ${r.g.time} · <span class="lp lv-${lvc(r.g.level)}" style="font-size:10px;padding:1px 6px">${lvl(r.g.level)}</span></div>
    </div>
    <div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:55%">
      ${r.shown.map(d=>`<span style="font-size:11px;padding:2px 7px;border-radius:10px;${dbg(d.key)};white-space:nowrap">${d.label}</span>`).join('')}

}

async function refreshDebts(){
  const btn=document.querySelector('[onclick="refreshDebts()"]');
  if(btn){btn.textContent='⏳ Загрузка...';btn.disabled=true;}
  await loadData();
  const now=new Date();
  window._debtsLastUpdate=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
  renderMain();
  if(btn){btn.textContent='🔄 Обновить';btn.disabled=false;}
  toast('Данные обновлены ✓','success');
}

function submitSupReport(supId){
  const a=D.accounts.find(x=>x.id===supId);if(!a) return;
  const group=document.getElementById('sup-report-group')?.value?.trim();
  const text=document.getElementById('sup-report-text')?.value?.trim();
  if(!text){toast('Опишите проблему','error');return;}
  if(!a.reports) a.reports=[];
  a.reports.push({id:uid(),groupName:group||'',text,date:new Date().toISOString().slice(0,10),status:'new',createdAt:new Date().toISOString()});
  sched();
  document.getElementById('sup-report-group').value='';
  document.getElementById('sup-report-text').value='';
  toast('Сообщение отправлено администратору ✓','success');
}

  const morningOk=supporters.filter(a=>a.schedule==='morning'||a.schedule==='full');

function dutyQueueAdd(slot){
  if(!D.settings) D.settings={};
  if(!D.settings.dutyQueue) D.settings.dutyQueue={morning:[],evening:[]};
  if(!D.settings.dutyQueue[slot]) D.settings.dutyQueue[slot]=[];
  const sel=document.getElementById(`q-add-${slot}`);
  const id=sel?.value;
  if(!id){toast('Выберите суппортера','error');return;}
  if(D.settings.dutyQueue[slot].includes(id)){toast('Уже в очереди','error');return;}
  D.settings.dutyQueue[slot].push(id);
  sched();showDutyQueue();
}

function dutyQueueMove(slot,idx,dir){
  const q=D.settings?.dutyQueue;if(!q||!q[slot]) return;
  const list=q[slot];
  const newIdx=idx+dir;
  if(newIdx<0||newIdx>=list.length) return;
  [list[idx],list[newIdx]]=[list[newIdx],list[idx]];
  sched();showDutyQueue();
}

function dutyQueueRemove(slot,idx){
  const q=D.settings?.dutyQueue;if(!q||!q[slot]) return;
  q[slot].splice(idx,1);
  sched();showDutyQueue();
}

function fillMonthFromQueue(month){
  if(!isAdmin()) return;
  const q=D.settings?.dutyQueue;
  if(!q||(!(q.morning||[]).length&&!(q.evening||[]).length)){
    toast('Сначала задайте очередь (кнопка «Очередь»)','error');return;
  }
  const [yr,mo]=month.split('-').map(Number);
  const daysInMonth=new Date(yr,mo,0).getDate();
  if(!D.duties) D.duties={};
  const mQueue=q.morning||[];
  const eQueue=q.evening||[];

  // Сначала удаляем все авто-дни этого месяца
  Object.keys(D.duties).forEach(d=>{
    if(d.startsWith(month)&&D.duties[d]._auto!==false) delete D.duties[d];
  });

  // Заполняем с 0 — день 1 = индекс 0, день 2 = индекс 1...
  let mPtr=0, ePtr=0, filled=0;
  for(let d=1;d<=daysInMonth;d++){
    const dateStr=`${yr}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    if(new Date(yr,mo-1,d).getDay()===0) continue; // skip Sunday
    const existing=D.duties[dateStr];
    if(existing&&existing._auto===false) continue; // preserve manual
    const mId=mQueue.length?mQueue[mPtr%mQueue.length]:null;
    const eId=eQueue.length?eQueue[ePtr%eQueue.length]:null;
    D.duties[dateStr]={morning:mId||null,evening:eId||null,_auto:true};
    mPtr++;
    ePtr++;
    filled++;
  }
  sched();gotoPage('duties');toast(`${filled} дней заполнено ✓`,'success');
}

async function sha256(str){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function hashPass(pass){return await sha256(pass);}
async function checkPass(input,stored){
  if(!stored)return false;
  if(stored.length===64&&/^[0-9a-f]+$/.test(stored))return(await sha256(input))===stored;
  return input===stored;
}

async function doLogin(){
  try{
    const login=(document.getElementById('li-login')?.value||'').trim().toLowerCase();
    const pass=document.getElementById('li-pass')?.value||'';
    document.getElementById('login-err').style.display='none';
    if(!login){showLoginErr('Введите логин');return;}
    if(!pass){showLoginErr('Введите пароль');return;}
    const btn=document.getElementById('li-btn');
    const restoreBtn=()=>{if(btn){btn.disabled=false;btn.textContent='Войти';}};
    if(btn){btn.disabled=true;btn.textContent='Вход...';}
    if(!dataLoaded){
      showLoginErr('Загрузка данных...');
      loadData().then(()=>{restoreBtn();document.getElementById('login-err').style.display='none';doLogin();});
      return;
    }
    const adminLogin=(D.settings?.adminLogin||'admin').toLowerCase();
    const adminPin=D.settings?.pin||DPIN;
    if(login===adminLogin||login==='admin'){
      if(await checkPass(pass,adminPin)||pass===DPIN){restoreBtn();curUser={role:'admin',name:D.settings?.adminName||'Администратор'};startApp();return;}
    }
    let tAcc=null;
    for(const a of(D.accounts||[])){if((a.login||'').toLowerCase()===login&&a.role!=='supporter'&&await checkPass(pass,a.password)){tAcc=a;break;}}
    if(tAcc){
      const teacher=D.teachers.find(x=>x.id===tAcc.teacherId);
      restoreBtn();curUser={role:'teacher',teacherId:tAcc.teacherId,name:teacher?teacher.name:login,accountId:tAcc.id};startApp();return;
    }
    let sAcc=null;
    for(const a of(D.accounts||[])){if((a.login||'').toLowerCase()===login&&a.role==='supporter'&&await checkPass(pass,a.password)){sAcc=a;break;}}
    if(sAcc){restoreBtn();curUser={role:'supporter',name:sAcc.name||login,accountId:sAcc.id};startApp();return;}
    restoreBtn();
    showLoginErr((D.accounts||[]).length>0?'Неверный логин или пароль':'Данные не загружены. Обновите страницу.');
    document.getElementById('li-pass').value='';
  }catch(err){showLoginErr('Ошибка: '+err.message);const btn=document.getElementById('li-btn');if(btn){btn.disabled=false;btn.textContent='Войти';}}
}

function renderSupporterEvents(el){
  const filterSup=window._supEvFilter||'';
  const filterType=window._supEvType||'all';
  const now=new Date();
  const filterMonth=window._supEvMonth||(now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0'));
  const supporters=(D.accounts||[]).filter(a=>a.role==='supporter');
  let events=[];
  supporters.forEach(a=>{
    (a.replacements||[]).forEach(r=>{if(!filterSup||a.id===filterSup)if(filterType==='all'||filterType==='replace')events.push({...r,supId:a.id,supName:a.name,evType:'replace'});});
    (a.mockTests||[]).forEach(r=>{if(!filterSup||a.id===filterSup)if(filterType==='all'||filterType===r.type)events.push({...r,supId:a.id,supName:a.name,evType:r.type||'mock'});});
  });
  if(filterMonth) events=events.filter(e=>(e.date||e.dateFrom||'').startsWith(filterMonth));
  events.sort((a,b)=>(a.date||a.dateFrom||'').localeCompare(b.date||b.dateFrom||''));
  el.innerHTML=`
    <div class="ph"><div><div class="pt">📝 События суппортеров</div><div class="ps">${events.length} событий</div></div>
      ${isAdmin()?`<button class="btn btn-pri btn-sm" onclick="showAddGlobalEvent()">+ Событие</button>`:''}
    </div>
    <div class="card" style="margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap">
      <select class="fs" style="flex:1" onchange="window._supEvFilter=this.value;renderMain()">
        <option value="">Все суппортеры</option>
        ${supporters.map(a=>`<option value="${a.id}" ${filterSup===a.id?'selected':''}>${a.name}</option>`).join('')}
      </select>
      <select class="fs" style="flex:1" onchange="window._supEvType=this.value;renderMain()">
        <option value="all">Все типы</option>
        <option value="replace">Замены</option>
        <option value="mock">Мок-тест</option>
        <option value="at">AT</option>
        <option value="demo">Демо</option>
      </select>
      <input type="month" class="fs" value="${filterMonth}" style="flex:1" onchange="window._supEvMonth=this.value;renderMain()">
    </div>
    <div class="card">
      ${!events.length?`<div style="padding:20px;text-align:center;color:#bbb">Нет событий</div>`:''}
      ${events.map(e=>`<div class="event-row">
        <div style="flex:1">
          <div style="font-size:13px;font-weight:500">${e.supName}</div>
          <div style="font-size:12px;color:var(--color-text-secondary)">${e.evType==='replace'?`Замена: ${e.groupName||'—'} · ${e.dateFrom||''}–${e.dateTo||''}`:`${e.type||e.evType}: ${e.groupName||''} · ${e.date||''}`}</div>
        </div>
        ${isAdmin()?`<button onclick="delSupEvent('${e.supId}','${e.id}')" style="font-size:11px;padding:2px 8px;border-radius:6px;border:1px solid #fcc;background:#fff5f5;color:#c00;cursor:pointer">✕</button>`:''}
      </div>`).join('')}
    </div>`;
}

function showEditReplace(supId,evId){
  const a=(D.accounts||[]).find(x=>x.id===supId);if(!a) return;
  const r=(a.replacements||[]).find(x=>x.id===evId);if(!r) return;
  openModal(`<div class="modal-title">✏️ Изменить замену</div>
    <div class="fg"><label class="fl">Группа</label><input type="text" class="fi" id="er-group" value="${r.groupName||''}"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="fg"><label class="fl">Дата начала</label><input type="date" class="fi" id="er-from" value="${r.dateFrom||''}"></div>
      <div class="fg"><label class="fl">Дата конца</label><input type="date" class="fi" id="er-to" value="${r.dateTo||''}"></div>
    </div>
    <div class="fa"><button class="btn btn-sec" onclick="closeModal()">Отмена</button>
      <button class="btn btn-pri" onclick="saveEditReplace('${supId}','${evId}')">Сохранить</button></div>`);
}

function saveEditReplace(supId,evId){
  const a=(D.accounts||[]).find(x=>x.id===supId);if(!a) return;
  const r=(a.replacements||[]).find(x=>x.id===evId);if(!r) return;
  r.groupName=document.getElementById('er-group')?.value?.trim()||r.groupName;
  r.dateFrom=document.getElementById('er-from')?.value||r.dateFrom;
  r.dateTo=document.getElementById('er-to')?.value||r.dateTo;
  closeModal();sched();toast('Сохранено ✓','success');renderAll();
}

function showEditEvent(supId,evId){
  const a=(D.accounts||[]).find(x=>x.id===supId);if(!a) return;
  const e=(a.mockTests||[]).find(x=>x.id===evId);if(!e) return;
  openModal(`<div class="modal-title">✏️ Изменить событие</div>
    <div class="fg"><label class="fl">Группа / Описание</label><input type="text" class="fi" id="ee-group" value="${e.groupName||''}"></div>
    <div class="fg"><label class="fl">Дата</label><input type="date" class="fi" id="ee-date" value="${e.date||''}"></div>
    <div class="fa"><button class="btn btn-sec" onclick="closeModal()">Отмена</button>
      <button class="btn btn-pri" onclick="saveEditEvent('${supId}','${evId}')">Сохранить</button></div>`);
}

function saveEditEvent(supId,evId){
  const a=(D.accounts||[]).find(x=>x.id===supId);if(!a) return;
  const e=(a.mockTests||[]).find(x=>x.id===evId);if(!e) return;
  e.groupName=document.getElementById('ee-group')?.value?.trim()||e.groupName;
  e.date=document.getElementById('ee-date')?.value||e.date;
  closeModal();sched();toast('Сохранено ✓','success');renderAll();
}

function showAddGlobalEvent(){
  const supporters=(D.accounts||[]).filter(a=>a.role==='supporter');
  openModal(`<div class="modal-title">📝 Добавить событие</div>
    <div class="fg"><label class="fl">Суппортер</label>
      <select class="fi" id="ge-sup">${supporters.map(a=>`<option value="${a.id}">${a.name}</option>`).join('')}</select>
    </div>
    <div class="fg"><label class="fl">Тип</label>
      <select class="fi" id="ge-type">
        <option value="mock">Мок-тест</option>
        <option value="at">Achievement Test</option>
        <option value="demo">Демо-урок</option>
      </select>
    </div>
    <div class="fg"><label class="fl">Группа / Описание</label><input type="text" class="fi" id="ge-group" placeholder="Описание"></div>
    <div class="fg"><label class="fl">Дата</label><input type="date" class="fi" id="ge-date" value="${new Date().toISOString().slice(0,10)}"></div>
    <div class="fa"><button class="btn btn-sec" onclick="closeModal()">Отмена</button>
      <button class="btn btn-pri" onclick="saveGlobalEvent()">Сохранить</button></div>`);
}

function saveGlobalEvent(){
  const supId=document.getElementById('ge-sup')?.value;
  const type=document.getElementById('ge-type')?.value||'mock';
  const groupName=document.getElementById('ge-group')?.value?.trim()||'';
  const date=document.getElementById('ge-date')?.value;
  if(!supId||!date){toast('Заполните все поля','error');return;}
  const a=(D.accounts||[]).find(x=>x.id===supId);if(!a) return;
  if(!a.mockTests) a.mockTests=[];
  a.mockTests.push({id:uid(),type,groupName,date});
  closeModal();sched();toast('Событие добавлено ✓','success');renderAll();
}

// ── Init ──────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded',()=>{
  applyTheme();applyI18n();updateLangBtn(curLang);checkMobile();
});
initApp();
setTimeout(()=>{applyI18n();updateLangBtn(curLang);},300);
</script>
